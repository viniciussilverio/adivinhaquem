<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudio após 2º Scroll</title>
    <style>
        /* Apenas para forçar a página a ter barra de rolagem */
        body {
            height: 200vh;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .info {
            position: fixed;
            top: 20px;
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="info">
        Role a página para baixo duas vezes... <br>
        Scrolls detectados: <span id="contador">0</span>
    </div>

    <!-- Elemento de áudio -->
    <audio id="meuAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto"></audio>

    <script>
        let scrollCount = 0;
        let audioPlayTriggered = false;
        const audio = document.getElementById('meuAudio');
        const contadorSpan = document.getElementById('contador');

        // Usamos 'wheel' ou 'scroll'. O evento 'scroll' é disparado a cada movimento.
        window.addEventListener('scroll', () => {
            // Evita continuar contando após o áudio já ter sido disparado
            if (audioPlayTriggered) return;

            // Incrementa o contador (você pode ajustar a lógica se quiser contar apenas "pulos" maiores de scroll)
            scrollCount++;
            contadorSpan.textContent = scrollCount;

            // Define que após 2 eventos de scroll o áudio toca
            if (scrollCount >= 2) {
                audioPlayTriggered = true;
                
                audio.play().then(() => {
                    console.log("Áudio tocando com sucesso!");
                }).catch(error => {
                    console.log("O navegador bloqueou a reprodução automática:", error);
                });
            }
        });
    </script>

</body>
</html>
